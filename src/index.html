<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Hon_Ichi_AR</title>
  <meta itemprop="name" content="Hon_Ichi_AR">
  <meta name="twitter:title" content="Hon_Ichi_AR">
  <meta property="og:title" content="Hon_Ichi_AR">
  <meta property="og:site_name" content="Hon_Ichi_AR">
  <meta name="description" content="">
  <meta itemprop="description" content="">
  <meta property="og:description" content="">
  <meta name="twitter:description" content="">
  <script crossorigin="anonymous" src="./external/scripts/8frame-1.5.0.min.js"></script>
  <script crossorigin="anonymous" src="./external/xrextras/xrextras.js"></script>
  <script crossorigin="anonymous" src="./external/landing-page/landing-page.js"></script>
  <script crossorigin="anonymous" src="./external/xr/xr.js" async="true" data-preload-chunks="face, slam">
  </script>

<meta name="8thwall:renderer" content="aframe:1.5.0"/>
<meta name="8thwall:package" content="@8thwall.xrextras"/>
<meta name="8thwall:package" content="@8thwall.landing-page"/>

<script src="//cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.2.0/dist/aframe-extras.min.js"></script>

<meta property="og:image" content="https://i.giphy.com/media/rAi32DNlsWNpItOpDr/giphy.gif"/>
</head>

<body>
<script src="bundle.js"></script>
<div class="over">
  <span id="promptText">マーカーをスキャンしてください</span>
</div>

<button id="camBtn">Camera OFF</button>
<button id="toggleSettingsBtn">✖️ 設定を閉じる</button>

<div id="settingsPanel">
  <div class="setting-row">
    <label>移動速度: <span id="val-speed">0.5</span> m/s</label>
    <input type="range" id="speedRange" min="0.1" max="10.0" step="0.1" value="0.5" />
  </div>
  <div class="setting-row">
    <label>大きさ: <span id="val-scale">5.0</span></label>
    <input type="range" id="scaleRange" min="0.5" max="100.0" step="0.5" value="5.0" />
  </div>
  <div class="setting-row">
    <label>右折まで: <span id="val-before">30</span> 秒</label>
    <input type="range" id="beforeRange" min="1" max="120" step="1" value="30" />
  </div>
  <div class="setting-row">
    <label>消えるまで: <span id="val-after">10</span> 秒</label>
    <input type="range" id="afterRange" min="1" max="120" step="1" value="10" />
  </div>
</div>

<a-scene
  marker-move
  camera-toggle
  settings-ui
  image-target="name: ForwardMarker; name: BackMarker; name: LeftMarker; name: RightMarker; name: GoDownTheStairsMarker; name: HonIchi_Goal2"
  landing-page
  xrextras-loading
  xrextras-runtime-error
  renderer="colorManagement:true"
  xrweb="allowedDevices: any;">
  <a-assets>
    <img id="groundTex" src="assets/sand.jpg" />
    <a-asset-item id="ichiModel" src="assets/Ichi_Walk2.glb"></a-asset-item>
    <a-asset-item id="goalModel" src="assets/HonIchi_Goal_confetti.glb"></a-asset-item>
  </a-assets>

  <a-camera
    id="camera"
    position="0 8 8"
    raycaster="objects: .cantap"
    cursor="fuse: false; rayOrigin: mouse;"></a-camera>
  <a-light type="ambient" intensity="0.5"></a-light>
  <a-box
    id="ground"
    class="cantap"
    scale="1000 2 1000"
    position="0 -0.99 0"
    material="shader: shadow; transparent: true; opacity: 0.4"
    shadow></a-box>
  <a-sky id="cameraMask" color="#000" radius="4000" visible="false"></a-sky>
</a-scene>

</body>

</html>
